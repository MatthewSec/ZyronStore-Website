<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyronStore - Loja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="shop.css">
</head>

<body>
    <div class="cart-modal" id="cartModal" style="display:none;">
        <div class="cart-modal-content">
            <span class="cart-modal-close" id="closeCartModal">&times;</span>
            <h2>Itens no Carrinho</h2>
            <ul class="cart-items-list"></ul>
            <div class="cart-total"></div>
        </div>
    </div>
    <header>
        <div class="logo">
            <i class="fa-solid fa-bolt"></i>
            <a href="index.html"><h1>ZyronStore</h1></a>
        </div>
        <div class="search-container">
            <input type="text" placeholder="Pesquisar produtos..." class="search-input">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="cart-area">
            <button class="cart-btn" aria-label="Abrir carrinho">
                <i class="fa-solid fa-cart-shopping cart-icon"></i>
                <span class="cart-count">0</span>
            </button>
        </div>
    </header>

    <div class="categories-container">
        <nav class="categories-bar">
            <button class="category-btn active" data-category="all">Todos</button>
            <button class="category-btn" data-category="smartphones">Smartphones</button>
            <button class="category-btn" data-category="laptops">Laptops</button>
            <button class="category-btn" data-category="headphones">Fones</button>
            <button class="category-btn" data-category="accessories">Acessórios</button>
            <button class="category-btn" data-category="smartwatches">Smartwatches</button>
        </nav>
    </div>

    <!-- HERO -->
    <section class="hero-section">
        <h2>Black Friday!</h2>
        <p>Encontre os melhores produtos de tecnologia com descontos imperdíveis.</p>
    </section>
    <main class="products">
        <div class="products-container">

        </div>

    </main>
    <footer>
        <div class="footer-content">
            <p>&copy; 2025 ZyronStore. Todos os direitos reservados.</p>
            <div class="footer-social">
                <a href="#" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" title="Twitter"><i class="fa-brands fa-x-twitter"></i></a>
            </div>
        </div>
    </footer>
</body>

<script src="loja.js"></script>

<!---- adicionar um carrinho e adicionar imagens do produtos --->
</html>
